[package]
name = "gl-manager-next"
version = "1.0.1"
description = "Modern profile and AppID list manager"
authors = ["GL Manager Next"]
edition = "2021"

[lib]
name = "gl_manager_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
dirs = "5.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }
scraper = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
thiserror = "2.0"
urlencoding = "2.1"
zip = "2.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
